<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<link rel="stylesheet" href="../node_modules/@fontsource/gaegu/700.css">
<style>

:root{
  --blue:#3059D8; --sky:#769EFD; --ink:#1A2233; --paper:#F5F7FB;
  --green:#1D9A6C; --amber:#E39A2D; --coral:#E0565B; --coralText:#C4373D;
  --line:#E3E8F2; --grid:#EEF2FB; --blueTint:#EAF0FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);overflow:hidden}
body{font-family:Pre,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--paper)}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1}
.frac .bar{height:.07em;width:118%;background:currentColor;border-radius:.05em;margin:.06em 0 .1em}
.hand{font-family:Gaegu,cursive;font-weight:700;color:var(--blue)}
.hand .frac .bar{transform:rotate(-3deg);height:.075em}
.math{font-family:KMain,serif}
.op{display:inline-block;vertical-align:middle;margin:0 .45em}

.title{position:absolute;font-weight:800;color:var(--blue);white-space:nowrap}
.title span{font-weight:700}
.qcount{position:absolute;font-weight:800;white-space:nowrap}
.prog{position:absolute;height:12px;border-radius:6px;background:linear-gradient(90deg,#345DDA,#769EFD)}
.navt{position:absolute;font-weight:600;color:var(--blue);white-space:nowrap}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--green)}
.submit{position:absolute;background:var(--blue);color:#fff;font-weight:700;border-radius:14px;display:flex;align-items:center;justify-content:center}
.card{position:absolute;background:#fff;border:2px solid var(--line);border-radius:26px}
.pill{position:absolute;background:#EEF2FB;color:var(--blue);font-weight:700;border-radius:999px;padding:.35em .9em;white-space:nowrap}
.qtext{position:absolute;word-break:keep-all;font-weight:700;line-height:1.75}
.qtext .frac{font-family:KMain,serif;font-weight:400;font-size:1.05em;margin:0 .15em}
.qtext .L{font-family:KMain,serif;font-weight:400}
.ansbox{position:absolute;border:3px solid var(--ink);border-radius:14px}
.ansbox i{position:absolute;left:24px;top:-15px;background:#fff;padding:0 8px;font-style:normal;font-weight:700;font-size:22px}
.confq{position:absolute;font-weight:700;white-space:nowrap}

.opt svg{margin-bottom:6px;flex:none}
.opt.row{flex-direction:row;gap:14px}
.opt.row svg{margin:0}
.o1{background:#ECF6F2;border-color:#B9E1CF}
.o2{background:#FDF6E8;border-color:#F1DAA5}
.o3{background:#FCF1F1;border-color:#F0C4C4}

.o1.sel{border-color:var(--green);border-width:3px;color:#145E43;background:#E2F3EB}
.tool{position:absolute;border:2px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;white-space:nowrap}

.canvas{position:absolute;background-color:#fff;background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:68px 68px;border-radius:6px}

.tok{display:inline-block}
.pen{position:absolute;width:0;height:0;pointer-events:none}
.pen svg{position:absolute;left:-20px;top:0;transform-origin:20px 0;transform:rotate(-35deg);filter:drop-shadow(6px 10px 8px rgba(26,34,51,.25))}
.touch{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:rgba(48,89,216,.22);border:4px solid rgba(48,89,216,.7)}
#dark{background:radial-gradient(120% 90% at 50% 45%,#222B44 0%,#141A2C 60%,#0E1220 100%)}

.dq{position:absolute;color:#fff;font-weight:800;white-space:nowrap}

.dcard .lab{font-weight:700}

#expBg{position:absolute;border-radius:20px}
#expVal{position:absolute;font-weight:800;white-space:nowrap;line-height:1.2}
#paper2{background:var(--paper)}
.head{position:absolute;font-weight:800;color:var(--coralText);white-space:nowrap;line-height:1.2}

.sub{position:absolute;top:0;bottom:0;width:2px;transform-origin:50% 0}
.blab{position:absolute;font-family:KMain,serif;text-align:right;white-space:nowrap}
.note{position:absolute;font-weight:800;color:var(--coralText);white-space:nowrap}
#newCard{position:absolute;background:#fff;border-radius:30px;border:2px solid var(--line);box-shadow:0 30px 80px -30px rgba(26,34,51,.25);overflow:hidden}
.spec{background:linear-gradient(90deg,var(--blue),var(--coral) 35%,var(--green) 65%,var(--amber))}
.hint{position:absolute;font-weight:700;color:#2B3445;white-space:nowrap}
.check{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -8px rgba(29,154,108,.6)}

.url{position:absolute;font-weight:700;color:var(--ink);white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center}
</style>

<script>
(async()=>{
await Promise.all(['700 80px Gaegu','500 30px Pre','600 30px Pre','700 30px Pre','800 30px Pre','900 30px Pre','30px KMain'].map(f=>document.fonts.load(f,'0123456789분수진단PRISM')));
// ---------------------------------------------------------------- setup
const Q=new URLSearchParams(location.search);
const V=Q.get('fmt')==='v';
const W=V?1080:1920, H=V?1920:1080, FPS=60;
const T=window.TIMING, h=T.hits;
const $=s=>document.querySelector(s);
const el=(tag,cls,html,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e};
const box=(e,x,y,w,hh)=>{Object.assign(e.style,{left:x+'px',top:y+'px'});if(w!=null)e.style.width=w+'px';if(hh!=null)e.style.height=hh+'px';return e};
const frac=(n,d,cls='')=>`<span class="frac ${cls}"><span>${n}</span><span class="bar"></span><span>${d}</span></span>`;
const stage=$('#stage');box(stage,0,0,W,H);
function off(e,anc){let x=0,y=0;while(e&&e!==anc){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y}}
const face=(c,mouth,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="${c}" stroke-width="3"/><circle cx="15.5" cy="18" r="2.4" fill="${c}"/><circle cx="28.5" cy="18" r="2.4" fill="${c}"/><path d="${mouth}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const SM='M13.5 26.5 Q22 34 30.5 26.5', MEH='M14 28 H30', SAD='M13.5 31 Q22 23.5 30.5 31';
const OPTS=[['o1','#3BA57E',SM,'답이 맞다고','확신해요.'],['o2','#D6A040',MEH,'아마 맞을 것','같아요.'],['o3','#E07A7A',SAD,'답이 맞는지','자신이 없어요.'],['o4','#4A5260',SAD,'전혀 몰라서','풀 수 없었어요.']];
const optHTML=(o,row,s)=>face(o[1],o[2],s)+(row?`<div>${o[3]} ${o[4]}</div>`:`<div>${o[3]}<br>${o[4]}</div>`);
// prism: glass triangle; light enters the left face and leaves the right face
const prismSVG=(s,id,paper)=>`<svg width="${s}" height="${s}" viewBox="-60 -60 120 120" style="overflow:visible">
 <defs><linearGradient id="pg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${paper?'#DCE6FF':'#9DB6FF'}" stop-opacity="${paper?1:.5}"/><stop offset=".6" stop-color="${paper?'#EEF3FF':'#3059D8'}" stop-opacity="${paper?1:.2}"/><stop offset="1" stop-color="#fff" stop-opacity="${paper?1:.3}"/></linearGradient></defs>
 <path d="M0 -52 L45 26 L-45 26 Z" fill="url(#pg${id})" stroke="${paper?'#3059D8':'#C9D7FF'}" stroke-width="${paper?3.2:2.6}" stroke-linejoin="round"/>
 <path d="M-2 -46 L-40 22" stroke="#fff" stroke-opacity="${paper?.9:.55}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const PEN=`<svg width="40" height="230" viewBox="0 0 40 230"><path d="M20 0 L31 26 H9 Z" fill="#C9CED8"/><circle cx="20" cy="2" r="2.5" fill="#1A2233"/><rect x="8" y="25" width="24" height="14" rx="3" fill="#8A93A3"/><rect x="8" y="38" width="24" height="192" rx="10" fill="#2B3445"/><rect x="12" y="44" width="5" height="170" rx="2.5" fill="#fff" fill-opacity=".18"/></svg>`;
const BEAMS=[{c:'#769EFD',lab:'오류 위치',val:'분모 계산'},{c:'#F07479',lab:'오개념',val:'분모가 다른 채로 뺌'},{c:'#2FBF8A',lab:'확신도',val:'확신함 · 그런데 오답'},{c:'#F2B04D',lab:'사고 수준',val:'통분 이해 이전'}];

// ------------------------------------------------------------- layouts
const LY=V?{
  hdrH:410, title:[60,316,46], qc:[600,318,38], prog:[770,338,170], showNav:false,
  left:[60,440,880,290], pill:[36,24,26], qtext:[36,82,808,32],
  tools:null, canvas:[60,750,880,370], ansbox:null,
  confq:[60,1134,30], opts:{x:60,y:1178,w:432,h:86,gx:16,gy:12,fs:26,row:true,cols:2}, submit:[60,1376,880,96,38],
  eqFont:96, camZoom:1.6, chipScale:1.45, chipPos:[500,1200], camC:[500,880],
  ans66:[220,420], ansScale:1.5, prism:[560,560,320], dq:[500,800,60],
  cards:{x:130,w:810,h:128,ys:[920,1070,1220,1370],lab:34,val:44}, focusScale:1.14,
  head:[500,380,58], eq2:[500,930], eqFont2:118, ann:72,
  bars:{x:200,w:680,h:160,ys:[700,950],lab:130,fs:60}, note:[500,1180,50], result:[500,1330,96],
  newCard:[60,500,880,660], npFont:96, npY:220, mini:{y:550,w:360,h:54,gap:60}, conf2:[500,1290,580,112,32], cap2:[500,1410,46],
  end:{glyph:[500,560,210], word:[500,770,160], sub:[500,890,66], line:[500,960], tag:[500,1050,56], url:[500,1170,42,560,88], cta:[500,1320,48,820,124]}
}:{
  hdrH:120, title:[40,40,44], qc:[620,36,40], prog:[790,54,250], showNav:true,
  left:[24,150,720,900], pill:[40,30,26], qtext:[40,100,650,31],
  tools:[770,150], canvas:[770,250,1126,800], ansbox:[44,330,632,250],
  confq:[44,640,30], opts:{x:44,y:690,w:152,h:140,gx:8,gy:0,fs:19,row:false,cols:4}, submit:[1730,18,166,84,34],
  eqFont:80, camZoom:2.25, chipScale:1.75, chipPos:[1290,905], camC:[960,540],
  ans66:[330,540], ansScale:1.6, prism:[800,560,440], dq:[800,215,64],
  cards:{x:1180,w:640,h:140,ys:[300,460,620,780],lab:30,val:46}, focusScale:1.18,
  head:[960,140,62], eq2:[960,640], eqFont2:128, ann:80,
  bars:{x:660,w:900,h:140,ys:[300,510],lab:140,fs:66}, note:[1110,710,50], result:[960,850,100],
  newCard:[460,110,1000,690], npFont:110, npY:220, mini:{y:560,w:400,h:58,gap:80}, conf2:[790,900,420,120,30], cap2:[1240,900,48],
  end:{glyph:[0,420,190], word:[0,420,170], sub:[0,420,70], line:[960,520], tag:[960,610,56], url:[960,735,40,480,76], cta:[960,862,42,480,104]}
};
const CX=LY.camC[0], CY=LY.camC[1];

// ------------------------------------------------------------- build UI
const ui=$('#ui');box(ui,0,0,W,H);
const hdr=box(el('div','hdr',null,ui),0,0,W,LY.hdrH);
box(el('div','title','PRISM <span>분수 진단</span>',hdr,{fontSize:LY.title[2]+'px'}),LY.title[0],LY.title[1]);
box(el('div','qcount','문항 3 / 3',hdr,{fontSize:LY.qc[2]+'px'}),LY.qc[0],LY.qc[1]);
box(el('div','prog',null,hdr),LY.prog[0],LY.prog[1],LY.prog[2]);
if(LY.showNav){box(el('div','dot',null,hdr),1300,52);box(el('div','navt','⛶ 전체화면',hdr,{fontSize:'32px'}),1345,38);box(el('div','navt','◀ 이전',hdr,{fontSize:'32px'}),1525,38)}
const submit=box(el('div','submit','제출하기',V?ui:hdr,{fontSize:LY.submit[4]+'px'}),...LY.submit.slice(0,4));
const left=box(el('div','card',null,ui),...LY.left);
box(el('div','pill','문항 3 / 3',left,{fontSize:LY.pill[2]+'px'}),LY.pill[0],LY.pill[1]);
box(el('div','qtext',`주스가 ${frac(7,10)}<span class="L">L</span> 있었습니다. 그중에서 ${frac(1,4)}<span class="L">L</span>를 마셨다면 남은 주스는 몇 <span class="L">L</span>인지 기약분수로 나타내어 보세요.`,left,{fontSize:LY.qtext[3]+'px'}),LY.qtext[0],LY.qtext[1],LY.qtext[2]);
if(LY.ansbox){const a=box(el('div','ansbox','<i>정답</i>',left),...LY.ansbox);
  box(el('div','hand',frac(6,6),a,{fontSize:'72px',position:'absolute'}),40,40)}
const confParent=V?ui:left;
box(el('div','confq','지금 답, 얼마나 확실한가요?',confParent,{fontSize:LY.confq[2]+'px'}),LY.confq[0],LY.confq[1]);
const O=LY.opts;const optEls=[];
OPTS.forEach((o,i)=>{const cx=i%O.cols, cy=Math.floor(i/O.cols);
  optEls.push(box(el('div','opt '+o[0]+(O.row?' row':''),optHTML(o,O.row,O.row?38:44),confParent,{fontSize:O.fs+'px'}),O.x+cx*(O.w+O.gx),O.y+cy*(O.h+O.gy),O.w,O.h))});
if(LY.tools){
  const [tx,ty]=LY.tools;
  const pen='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1A2233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const era='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1A2233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/></svg>';
  box(el('div','tool on',pen+'펜',ui,{fontSize:'34px'}),tx,ty,190,82);
  box(el('div','tool',era+'지우개',ui,{fontSize:'34px'}),tx+206,ty,190,82);
  box(el('div','tool off','🗑 모두 지우기',ui,{fontSize:'34px'}),tx+412,ty,240,82);
  box(el('div','tool','<span style="font-size:34px;color:#8A93A3">↶</span>',ui),tx+668,ty,86,82);
  box(el('div','tool','<span style="font-size:34px;color:#8A93A3">↷</span>',ui),tx+770,ty,86,82);
}
const canvas=box(el('div','canvas',null,ui),...LY.canvas);
const eq=el('div','hand',null,canvas,{fontSize:LY.eqFont+'px'});eq.id='eq';
eq.innerHTML=`<span class="tok">${frac(7,10)}</span><span class="tok op">−</span><span class="tok">${frac(1,4)}</span><span class="tok op">=</span><span class="tok" id="t5">${frac('<span id="n6">6</span>','<span id="d6">6</span>')}</span>`;
const eqW=eq.offsetWidth, eqH=eq.offsetHeight;box(eq,(LY.canvas[2]-eqW)/2,(LY.canvas[3]-eqH)/2);
const t5=$('#t5');const c6=off(t5,canvas);const cw=t5.offsetWidth, ch=t5.offsetHeight;
// wrong = a red 빗금 (slash) through the answer; a circle would read as 정답 to Korean parents
const slash=el('div','abs',`<svg width="${cw}" height="${ch}" style="overflow:visible"><path id="slashP" d="M${cw*1.15} ${-ch*0.08} Q ${cw*0.55} ${ch*0.45} ${-cw*0.15} ${ch*1.08}" fill="none" stroke="#E0565B" stroke-width="7" stroke-linecap="round"/></svg>`,canvas);
box(slash,c6.x,c6.y);
const slashP=$('#slashP');const slashL=slashP.getTotalLength();
const pen1=el('div','pen',PEN,canvas);
const pn6=off($('#n6'),canvas),pd6=off($('#d6'),canvas),pb6=off(t5.querySelector('.bar'),canvas);
const n6e=$('#n6'),d6e=$('#d6');
const sixUI=off(t5,ui);const SIX={x:sixUI.x+cw/2,y:sixUI.y+ch/2};
const eqUI=off(eq,ui);const EQC={x:eqUI.x+eqW/2,y:eqUI.y+eqH/2};
const conf=$('#confFloat');conf.className='opt o1'+(O.row?' row':'')+' abs';conf.innerHTML=optHTML(OPTS[0],O.row,O.row?38:44);
Object.assign(conf.style,{fontSize:O.fs+'px',width:O.w+'px',height:O.h+'px'});
const opt1=off(optEls[0],ui);const SLOT={x:opt1.x+O.w/2,y:opt1.y+O.h/2};

if(!V)to(h.pullback+0.8,cam,{s:1.04,cx:W/2+(SUB.x-W/2)*0.12,cy:H/2+(SUB.y-H/2)*0.12,duration:0.7,ease:'power2.inOut'});
to(h.submitTap,submit,{scale:0.92,backgroundColor:'#1F3FA6',duration:0.08,ease:'power2.in'});

to(h.lift+0.3,ans,{color:'#FFFFFF',duration:0.5});
to(h.lift+0.3,ans,{left:AX,duration:0.95,ease:'power2.inOut'});
to(h.lift+0.3,ans,{top:AY,duration:0.95,ease:'back.inOut(1.3)'});
to(h.lift+0.3,ans,{scale:LY.ansScale,duration:0.95,ease:'power2.inOut'});

ft(h.prismIn,prismWrap,{opacity:0,y:90,scale:0.8,rotation:-10},{opacity:1,y:0,scale:1,rotation:0,duration:0.9,ease:'back.out(1.4)'});

const HDx=parseFloat(headA.style.left), HDy=parseFloat(headA.style.top);
to(h.toPaper,expVal,{left:HDx,top:HDy,fontSize:LY.head[2],duration:0.55,ease:'expo.inOut'});
to(h.toPaper+0.45,expVal,{color:'#C4373D',duration:0.3,ease:'power1.inOut'});

const expLab=el('div','abs',BEAMS[1].lab,$('#expander'),{color:'#F07479',fontWeight:700,fontSize:CD.lab*FS+'px',whiteSpace:'nowrap'});
const lab2=cardEls[1].querySelector('.lab');const l2o=off(lab2,cardEls[1]);
gsap.set(expLab,{left:v2x,top:C2.y+(CD.ys[1]-CD.h/2+l2o.y-C2.y)*FS,opacity:0});show(h.toPaper,expLab);to(h.toPaper,expLab,{opacity:0,y:-30,duration:0.25,ease:'power2.in'});
const P2=$('#paper2');gsap.set(P2,{opacity:0});
show(h.toPaper+0.9,P2);hide(h.toPaper+0.92,['#expander',dark]);
ft(h.toPaper+0.9,p2in,{scale:1},{scale:1.06,duration:h.newCard-h.toPaper-0.9,ease:'none'});
gsap.set(headB,{opacity:0});
// the equation arrives under the headline
gsap.set(['#p1','#p2','#eqP .op'],{opacity:0,y:40});gsap.set('#p66',{opacity:0,scale:0.4});
ft(h.toPaper+0.85,['#p1','#eqP .op','#p2'],{opacity:0,y:40},{opacity:1,y:0,duration:0.45,stagger:0.05,ease:'power3.out'});
ft(h.toPaper+1.0,'#p66',{opacity:0,scale:0.4},{opacity:1,scale:1,duration:0.5,ease:'back.out(2)'});
// the child's two moves, drawn quickly on the words
gsap.set(['#aTopH','#aBotH',lTop,lBot],{opacity:0});
['#aTop','#aBot'].forEach((s,i)=>{const p=$(s);draw(i?h.arrowBottom-0.3:h.arrowTop-0.3,p,p.getTotalLength(),0.3)});
show(h.arrowTop,'#aTopH');show(h.arrowBottom,'#aBotH');
ft(h.arrowTop,lTop,{opacity:0,y:20,clipPath:'inset(0% 100% 0% 0%)'},{opacity:1,y:0,clipPath:'inset(0% 0% 0% 0%)',duration:0.4,ease:'power2.out'});
ft(h.arrowBottom,lBot,{opacity:0,y:-20,clipPath:'inset(0% 100% 0% 0%)'},{opacity:1,y:0,clipPath:'inset(0% 0% 0% 0%)',duration:0.4,ease:'power2.out'});
to(h.arrowBottom+0.5,'#p66',{color:'#E0565B',scale:1.15,duration:0.25,ease:'power2.out'});
to(h.arrowBottom+0.75,'#p66',{scale:1,duration:0.5,ease:'power2.inOut'});
to(h.arrowBottom+0.9,eqG,{y:-8,duration:0.8,ease:'sine.inOut'});
// bars: the equation leaves first, then the pieces arrive (no overlap)
to(h.bars-0.35,eqG,{y:-160,opacity:0,duration:0.35,ease:'power3.in'});
const barParts=[barA.row,barB.row];gsap.set(barParts,{opacity:0,scaleX:0.5,transformOrigin:'0% 50%'});
gsap.set([labA,labB,labA2,labB2],{opacity:0,x:-20});gsap.set([...barA.cells,...barB.cells],{opacity:0});
ft(h.bars,barParts,{opacity:0,scaleX:0.5},{opacity:1,scaleX:1,duration:0.6,stagger:0.12,ease:'expo.out'});
ft(h.bars+0.1,barA.cells,{opacity:0},{opacity:1,duration:0.18,stagger:0.035,ease:'none'});
ft(h.bars+0.22,barB.cells,{opacity:0},{opacity:1,duration:0.18,stagger:0.07,ease:'none'});
ft(h.bars+0.05,[labA,labB],{opacity:0,x:-20},{opacity:1,x:0,duration:0.5,stagger:0.12,ease:'power3.out'});
['#bA','#bB'].forEach((s,i)=>{const p=$(s);draw(h.sizeNote-0.3+i*0.1,p,p.getTotalLength(),0.3,'power2.out')});
gsap.set(note,{opacity:0,y:24});ft(h.sizeNote,note,{opacity:0,y:24},{opacity:1,y:0,duration:0.5,ease:'back.out(1.6)'});
ft(h.sizeNote+0.5,[barA.cells[0],barB.cells[0]],{filter:'brightness(1)'},{filter:'brightness(1.3)',duration:0.4,yoyo:true,repeat:1,ease:'sine.inOut'});
// --- re-slice into twentieths; the headline turns from the mistake to the method
to(h.reslice-0.2,[note,'#bA','#bB'],{opacity:0,duration:0.2,ease:'power2.in'});
to(h.reslice-0.2,headA,{opacity:0,y:-30,duration:0.25,ease:'power2.in'});
ft(h.reslice,headB,{opacity:0,y:30},{opacity:1,y:0,duration:0.4,ease:'power3.out'});

ft(h.reslice+0.08,barB.subs,{scaleY:0},{scaleY:1,duration:0.25,stagger:0.018,ease:'power2.out'});
to(h.reslice+0.2,[labA,labB],{opacity:0,y:-24,duration:0.2,ease:'power2.in'});
ft(h.reslice+0.3,[labA2,labB2],{opacity:0,x:0,y:24},{opacity:1,y:0,duration:0.4,stagger:0.08,ease:'power3.out'});
// take the 5 twentieths away from the 14
gsap.set([chunk,hole],{opacity:0});
show(h.remove,chunk);set(h.remove,barB.cells[0],{backgroundColor:'transparent'});
to(h.remove,chunk,{x:BR.w*0.45,y:BR.ys[0]-BR.ys[1],duration:0.45,ease:'power3.inOut'});
ft(h.remove+0.42,hole,{opacity:0},{opacity:1,duration:0.3,ease:'power2.inOut'});to(h.remove+0.42,chunk,{opacity:0,duration:0.3,ease:'power2.inOut'});set(h.remove+0.75,chunk,{display:'none'});
to(h.remove+0.45,labA2,{opacity:0,y:-24,duration:0.2,ease:'power2.in'});ft(h.remove+0.6,labA3,{opacity:0,y:24},{opacity:1,y:0,duration:0.35,ease:'power3.out'});
to(h.remove+0.3,labB2,{opacity:0.3,duration:0.3});
// result
gsap.set(res,{opacity:0,y:30});
ft(h.nineTwenty-0.1,res,{opacity:0,y:30},{opacity:1,y:0,duration:0.45,ease:'power3.out'});
to(h.nineTwenty+0.1,'#r920',{scale:1.18,duration:0.18,ease:'power2.out'});to(h.nineTwenty+0.28,'#r920',{scale:1,duration:0.4,ease:'back.out(2)'});
// --- S6: the page clears fully, then the card made for this child slides in
to(h.newCard-0.36,p2in,{x:-W*0.3,opacity:0,duration:0.28,ease:'power3.in'});
gsap.set(NC,{opacity:0,x:W*0.75,rotation:2});gsap.set('#spec',{width:0});
show(h.newCard-0.12,NC);ft(h.newCard-0.12,NC,{x:W*0.75,rotation:2},{x:0,rotation:0,duration:0.75,ease:'expo.out'});
ft(h.newCard+0.2,'#spec',{width:0},{width:NCL[2],duration:0.7,ease:'power3.inOut'});
gsap.set([...mA.subs,...mB.subs],{scaleY:0});
ft(h.miniSlice,mA.subs,{scaleY:0},{scaleY:1,duration:0.25,stagger:0.05,ease:'power2.out'});
ft(h.miniSlice+0.1,mB.subs,{scaleY:0},{scaleY:1,duration:0.25,stagger:0.03,ease:'power2.out'});
gsap.set(['#a1','#ans110 .bar','#a10'],{clipPath:'inset(0% 100% 0% 0%)'});
to(h.writeAnswer,'#a1',{clipPath:'inset(0% 0% 0% 0%)',duration:0.12,ease:'none'});
to(h.writeAnswer+0.13,'#ans110 .bar',{clipPath:'inset(0% 0% 0% 0%)',duration:0.1,ease:'power1.inOut'});
to(h.writeAnswer+0.24,'#a10',{clipPath:'inset(0% 0% 0% 0%)',duration:0.22,ease:'none'});
const okP=$('#okP');draw(h.check,okP,okP.getTotalLength(),0.35,'power2.inOut');
gsap.set(pen2,{left:a1o.x+40,top:a1o.y-60,opacity:0,scale:0.9});
ft(h.writeAnswer-0.25,pen2,{opacity:0,left:a1o.x+90,top:a1o.y-120},{opacity:1,left:a1o.x+$('#a1').offsetWidth*0.5,top:a1o.y+10,duration:0.25,ease:'power2.out'});
to(h.writeAnswer,pen2,{top:a1o.y+$('#a1').offsetHeight*0.85,duration:0.12,ease:'none'});
to(h.writeAnswer+0.13,pen2,{left:a10o.x+$('#a10').offsetWidth,top:a10o.y-8,duration:0.1,ease:'power1.inOut'});
to(h.writeAnswer+0.24,pen2,{left:a10o.x+$('#a10').offsetWidth*0.9,top:a10o.y+$('#a10').offsetHeight*0.7,duration:0.22,ease:'sine.inOut'});
to(h.writeAnswer+0.48,pen2,{left:'+=90',top:'+=160',opacity:0,duration:0.35,ease:'power2.in'});
to(h.check,nbox,{borderColor:'#1D9A6C',duration:0.2});
gsap.set(conf2,{opacity:0,y:50,scale:0.7});gsap.set(cap2,{opacity:0,y:24});
ft(h.confAgain,conf2,{opacity:0,y:50,scale:0.7},{opacity:1,y:0,scale:1,duration:0.55,ease:'back.out(1.8)'});
ft(h.confAgain+0.15,cap2,{opacity:0,y:24},{opacity:1,y:0,duration:0.4,ease:'power3.out'});
ft(h.newCard+0.7,NC,{y:0},{y:-10,duration:h.logo-h.newCard-0.7,ease:'sine.inOut'});

// --- S7: the card's spectrum edge becomes the underline; the name rises out of it
to(h.logo-0.4,[conf2,cap2],{opacity:0,y:20,duration:0.3,ease:'power2.in'});
to(h.logo-0.4,NC.querySelectorAll(':scope > :not(#spec)'),{opacity:0,duration:0.3,ease:'power2.in'});
to(h.logo-0.3,NC,{backgroundColor:'rgba(255,255,255,0)',borderColor:'rgba(227,232,242,0)',boxShadow:'0 30px 80px -30px rgba(26,34,51,0)',duration:0.3,ease:'power2.in'});
set(h.logo-0.05,NC,{opacity:0});
const ENDL=$('#end');gsap.set(ENDL,{opacity:0,background:'transparent'});show(h.logo-0.05,ENDL);set(h.logo+0.05,ENDL,{background:'#F5F7FB'});set(h.logo+0.05,P2,{opacity:0});
const LX=parseFloat(line.style.left),LYY=parseFloat(line.style.top);
gsap.set(line,{left:NCL[0],top:NCL[1],width:NCL[2],height:12,borderRadius:0});
to(h.logo-0.05,line,{left:LX,top:LYY,width:rowW,height:10,borderRadius:5,duration:0.5,ease:'expo.inOut'});
gsap.set([word,sub],{opacity:0,y:60,scale:0.94});ft(h.logo+0.3,[word,sub],{opacity:0},{opacity:1,duration:0.12,stagger:0.06,ease:'none'});ft(h.logo+0.3,[word,sub],{y:60,scale:0.94},{y:0,scale:1,duration:0.6,stagger:0.06,ease:'expo.out'});
gsap.set(glyph,{scale:0.6,opacity:0,y:30});
ft(h.logo+0.35,glyph,{scale:0.6,opacity:0,y:30},{scale:1,opacity:1,y:0,duration:0.6,ease:'back.out(1.7)'});
const gIn=glyph.querySelector('#gIn');const gRays=[...glyph.querySelectorAll('#gRays line')];
const gL=l=>Math.hypot(l.x2.baseVal.value-l.x1.baseVal.value,l.y2.baseVal.value-l.y1.baseVal.value);
draw(h.logo+0.65,gIn,gL(gIn),0.25,'power2.in');
gRays.forEach((l,i)=>draw(h.logo+0.85+i*0.06,l,gL(l),0.4,'power3.out'));
gsap.set(tag,{opacity:0,y:30});ft(h.tagline,tag,{opacity:0,y:30},{opacity:1,y:0,duration:0.5,ease:'power3.out'});
gsap.set(url,{opacity:0,y:20});ft(h.url,url,{opacity:0,y:20},{opacity:1,y:0,duration:0.5,ease:'power3.out'});
gsap.set(cta,{opacity:0,scale:0.7});ft(h.cta,cta,{opacity:0,scale:0.7},{opacity:1,scale:1,duration:0.6,ease:'back.out(2)'});
// the end keeps breathing to the last frame
ft(h.logo+0.3,END,{scale:1},{scale:1.03,duration:T.duration-h.logo-0.3,ease:'none'});
to(h.cta+0.8,cta,{scale:1.045,duration:0.4,ease:'sine.inOut',yoyo:true,repeat:3});
tl.set({}, {}, T.duration);

window.seek=f=>{tl.seek(f/FPS,false);applyCam()};
window.seek(0);window.READY=true;
})();
</script>
