<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraBold.woff2)}
html,body{margin:0;width:1920px;height:1080px;background:#0E1020;overflow:hidden;font-family:P}
#w{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:140px;letter-spacing:-4px}
#b{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(90deg,#6C5CE7,#00D2D3);transform-origin:left;}
</style><script src="../node_modules/gsap/dist/gsap.min.js"></script></head>
<body><div id="b"></div><div id="w">3 − (−2) = ?</div>
<script>
const tl=gsap.timeline({paused:true});
tl.from('#w',{y:80,opacity:0,duration:.8,ease:'power3.out'},0)
  .to('#b',{scaleX:0,transformOrigin:'right',duration:.9,ease:'expo.inOut'},0)
  .to('#w',{scale:1.15,duration:2,ease:'sine.inOut'},.8);
window.seek=f=>tl.seek(f/60,false);
</script></body></html>
