<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>PRISM 분수 진단 — film</title>
<link rel="stylesheet" href="../node_modules/@fontsource/gaegu/700.css">
<style>
@font-face{font-family:Pre;font-weight:500;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2)}
@font-face{font-family:Pre;font-weight:600;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2)}
@font-face{font-family:Pre;font-weight:700;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2)}
@font-face{font-family:Pre;font-weight:800;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-ExtraBold.woff2)}
@font-face{font-family:Pre;font-weight:900;src:url(../node_modules/pretendard/dist/web/static/woff2/Pretendard-Black.woff2)}
@font-face{font-family:KMain;src:url(../node_modules/katex/dist/fonts/KaTeX_Main-Regular.woff2)}
:root{
  --blue:#3059D8; --sky:#769EFD; --ink:#1A2233; --paper:#F5F7FB;
  --green:#1D9A6C; --amber:#E39A2D; --coral:#E0565B;
  --line:#E3E8F2; --grid:#EEF2FB; --blueTint:#EAF0FF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);overflow:hidden}
body{font-family:Pre,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:var(--paper)}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:100%;height:100%}
/* fractions */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1}
.frac .bar{height:.07em;width:118%;background:currentColor;border-radius:.05em;margin:.06em 0 .1em}
.hand{font-family:Gaegu,cursive;font-weight:700;color:var(--blue)}
.hand .frac .bar{transform:rotate(-3deg);height:.075em}
.math{font-family:KMain,serif}
.op{display:inline-block;vertical-align:middle;margin:0 .32em}
/* UI */
#ui{position:absolute;left:0;top:0;background:var(--paper)}
.hdr{position:absolute;left:0;top:0;background:#fff;border-bottom:2px solid var(--line)}
.title{position:absolute;font-weight:800;color:var(--blue);letter-spacing:-.01em;white-space:nowrap}
.title span{font-weight:700}
.qcount{position:absolute;font-weight:800;white-space:nowrap}
.prog{position:absolute;height:12px;border-radius:6px;background:linear-gradient(90deg,#345DDA,#769EFD)}
.navt{position:absolute;font-weight:600;color:var(--blue);white-space:nowrap}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--green)}
.submit{position:absolute;background:var(--blue);color:#fff;font-weight:700;border-radius:14px;display:flex;align-items:center;justify-content:center}
.card{position:absolute;background:#fff;border:2px solid var(--line);border-radius:26px}
.pill{position:absolute;background:#EEF2FB;color:var(--blue);font-weight:700;border-radius:999px;padding:.35em .9em;white-space:nowrap}
.qtext{position:absolute;word-break:keep-all;font-weight:700;line-height:1.75;letter-spacing:-.01em}
.qtext .frac{font-family:KMain,serif;font-weight:400;font-size:1.05em;margin:0 .15em}
.qtext .L{font-family:KMain,serif;font-weight:400}
.ansbox{position:absolute;border:3px solid var(--ink);border-radius:14px}
.ansbox i{position:absolute;left:24px;top:-15px;background:#fff;padding:0 8px;font-style:normal;font-weight:700;font-size:22px}
.confq{position:absolute;font-weight:700;white-space:nowrap}
.opt{position:absolute;border-radius:14px;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:600;line-height:1.3;color:#556070}
.opt svg{margin-bottom:6px}
.o1{background:#ECF6F2;border-color:#B9E1CF}
.o2{background:#FDF6E8;border-color:#F1DAA5}
.o3{background:#FCF1F1;border-color:#F0C4C4}
.o4{background:#E1E2E4;border-color:#B8BCC3;color:var(--ink)}
.o1.sel{border-color:var(--green);border-width:3px;color:#145E43;background:#E2F3EB}
.tool{position:absolute;border:2px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;white-space:nowrap}
.tool.on{border-color:var(--blue);background:var(--blueTint)}
.tool.off{color:#DAACAE}
.canvas{position:absolute;background-color:#fff;
  background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px);background-size:68px 68px;border-radius:6px;overflow:visible}
#eq{position:absolute;white-space:nowrap;display:flex;align-items:center}
#eq > *{flex:none}
.tok{display:inline-block}
/* touch */
.touch{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(48,89,216,.18);border:3px solid rgba(48,89,216,.55)}
/* dark */
#dark{background:radial-gradient(120% 90% at 50% 45%,#222B44 0%,#141A2C 60%,#0E1220 100%)}
#darkGrid{background-image:linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px);background-size:68px 68px}
#ans66{position:absolute;color:#fff;text-shadow:0 0 30px rgba(160,190,255,.8)}
#beam{position:absolute;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 30%);box-shadow:0 0 24px 6px rgba(190,210,255,.65);transform-origin:0 50%}
#prismWrap{position:absolute}
#rays line{stroke-linecap:round}
.dcard{position:absolute;border-radius:20px;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.dcard .cbar{position:absolute;left:0;top:0;bottom:0;width:10px}
.dcard .lab{font-weight:700;letter-spacing:.02em}
.dcard .val{color:#fff;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.dcard .valwrap{overflow:hidden}
#expander{position:absolute;border-radius:20px}
/* paper 2 */
#paper2{background:var(--paper)}
.barrow{position:absolute;display:flex;border-radius:12px;overflow:hidden;border:3px solid}
.cell{flex:1;position:relative;border-right:2px solid rgba(255,255,255,.9)}
.cell:last-child{border-right:none}
.sub{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.95);transform-origin:50% 0}
.blab{position:absolute;font-family:KMain,serif;font-size:64px;text-align:right;white-space:nowrap}
.note{position:absolute;font-weight:800;color:var(--coral);white-space:nowrap}
#newCard{position:absolute;background:#fff;border-radius:30px;border:2px solid var(--line);box-shadow:0 30px 80px -30px rgba(26,34,51,.25);overflow:hidden}
#spec{position:absolute;left:0;top:0;height:12px;background:linear-gradient(90deg,var(--blue),var(--green) 35%,var(--amber) 65%,var(--coral))}
.hint{position:absolute;font-weight:600;color:#4A5568;white-space:nowrap}
.check{position:absolute;width:84px;height:84px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -8px rgba(29,154,108,.6)}
/* end */
#end{background:var(--paper)}
.word{position:absolute;white-space:nowrap;line-height:1}
.cta{position:absolute;background:var(--blue);color:#fff;font-weight:800;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:16px;white-space:nowrap;box-shadow:0 18px 40px -16px rgba(48,89,216,.7)}
.url{position:absolute;font-weight:700;color:var(--ink);white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center}
</style>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
<div id="stage">
  <!-- ===== S1/S2 : the real diagnostic UI, filmed by a camera ===== -->
  <div id="cam" class="abs" style="left:0;top:0;transform-origin:0 0">
    <div id="ui"></div>
  </div>
  <div id="focus" class="layer" style="pointer-events:none"></div>
  <div id="confFloat" class="abs" style="transform-origin:50% 50%"></div>
  <div id="touch" class="touch"></div>

  <!-- ===== S3/S4 : light and prism ===== -->
  <div id="dark" class="layer">
    <div id="darkGrid" class="layer"></div>
    <div id="darkInner" class="layer" style="transform-origin:50% 50%">
      <svg id="rays" class="layer" style="overflow:visible"></svg>
      <div id="beam"></div>
      <div id="prismWrap"></div>
      <div id="ans66" class="hand"></div>
      <div id="dcards"></div>
    </div>
  </div>
  <div id="expander"></div>

  <!-- ===== S5/S6 : the misconception, then a problem made for one child ===== -->
  <div id="paper2" class="layer">
    <div id="eqGroup" class="abs" style="transform-origin:50% 50%"></div>
    <div id="barGroup" class="abs" style="left:0;top:0"></div>
    <div id="newCard"></div>
    <div id="conf2" class="abs" style="transform-origin:50% 50%"></div>
  </div>

  <!-- ===== S7 : end mark ===== -->
  <div id="end" class="layer"></div>
</div>

<script>
(async()=>{
// fonts must be loaded before anything is measured
await Promise.all(['700 80px Gaegu','500 30px Pre','600 30px Pre','700 30px Pre','800 30px Pre','900 30px Pre','30px KMain'].map(f=>document.fonts.load(f,'0123456789분수진단PRISM')));
// ---------------------------------------------------------------- setup
const Q=new URLSearchParams(location.search);
const V=Q.get('fmt')==='v';
const W=V?1080:1920, H=V?1920:1080, FPS=60;
const T=window.TIMING, h=T.hits;
const $=s=>document.querySelector(s);
const el=(tag,cls,html,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(style)Object.assign(e.style,style);if(parent)parent.appendChild(e);return e};
const box=(e,x,y,w,hh)=>{Object.assign(e.style,{left:x+'px',top:y+'px'});if(w!=null)e.style.width=w+'px';if(hh!=null)e.style.height=hh+'px';return e};
const frac=(n,d,cls='')=>`<span class="frac ${cls}"><span>${n}</span><span class="bar"></span><span>${d}</span></span>`;
const stage=$('#stage');box(stage,0,0,W,H);
// offset position of an element relative to an ancestor (ignores transforms)
function off(e,anc){let x=0,y=0;while(e&&e!==anc){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x,y}}
const smile=(c,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="${c}" stroke-width="3"/><circle cx="15.5" cy="18" r="2.4" fill="${c}"/><circle cx="28.5" cy="18" r="2.4" fill="${c}"/><path d="M13.5 26.5 Q22 34 30.5 26.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const meh=(c,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="${c}" stroke-width="3"/><circle cx="15.5" cy="18" r="2.4" fill="${c}"/><circle cx="28.5" cy="18" r="2.4" fill="${c}"/><path d="M14 28 H30" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const sad=(c,s=44)=>`<svg width="${s}" height="${s}" viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" fill="none" stroke="${c}" stroke-width="3"/><circle cx="15.5" cy="18" r="2.4" fill="${c}"/><circle cx="28.5" cy="18" r="2.4" fill="${c}"/><path d="M13.5 31 Q22 23.5 30.5 31" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`;
const OPTS=[['o1',smile('#3BA57E'),'답이 맞다고<br>확신해요.'],['o2',meh('#D6A040'),'아마 맞을 것<br>같아요.'],['o3',sad('#E07A7A'),'답이 맞는지<br>자신이 없어요.'],['o4',sad('#4A5260'),'전혀 몰라서<br>풀 수 없었어요.']];
const prismSVG=(s,id)=>`<svg width="${s}" height="${s}" viewBox="-60 -60 120 120" style="overflow:visible">
 <defs><linearGradient id="pg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9DB6FF" stop-opacity=".55"/><stop offset=".55" stop-color="#3059D8" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".35"/></linearGradient>
 <linearGradient id="ps${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9D7FF"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
 <path d="M0 -52 L45 26 L-45 26 Z" fill="url(#pg${id})" stroke="url(#ps${id})" stroke-width="2.6" stroke-linejoin="round"/>
 <path d="M0 -52 L8 14 L45 26" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"/></svg>`;
const BEAMS=[{c:'#769EFD',lab:'오류 위치',val:'분모 계산'},{c:'#F07479',lab:'오개념',val:'분모가 다른 채로 뺌'},{c:'#2FBF8A',lab:'확신도',val:'확신함 · 그런데 오답'},{c:'#F2B04D',lab:'사고 수준',val:'통분 이해 이전'}];

// ------------------------------------------------------------- layouts
const LY=V?{
  hdrH:320, title:[56,236,46], qc:[640,236,40], prog:[790,258,220], showNav:false,
  left:[40,350,1000,310], pill:[40,26,26], qtext:[40,86,920,34],
  tools:null, canvas:[40,685,1000,500],
  ansbox:null, confq:[40,1205,30], opts:[40,1250,238,122,16,22], submit:[40,1395,1000,92,38],
  eqFont:96, camZoom:1.55, chipScale:1.5, chipPos:[540,1205],
  ans66:[150,600], ansScale:1.5, prism:[340,1000,300], prismRot:0, beamDir:'right',
  cards:{x:540,w:500,h:122,ys:[775,925,1075,1225]}, cardLab:24, cardVal:34,
  eq2:[540,560,1.0], bars:{x:150,w:780,h:96,ys:[930,1090],lab:110}, note:[540,1260,48],
  newCard:[70,600,940,620], conf2:[540,1330],
  end:{glyph:[540,640,230], word:[540,880,150], sub:[540,1000,64], tag:[540,1120,52], url:[540,1250,40], cta:[540,1380]}
}:{
  hdrH:120, title:[40,40,44], qc:[620,36,40], prog:[790,54,250], showNav:true,
  left:[24,150,720,900], pill:[40,30,26], qtext:[40,100,650,31],
  tools:[770,150], canvas:[770,250,1126,800],
  ansbox:[44,330,632,250], confq:[44,640,30], opts:[44,690,152,140,8,19], submit:[1730,18,166,84,34],
  eqFont:80, camZoom:2.25, chipScale:1.9, chipPos:[1620,560],
  ans66:[330,540], ansScale:1.6, prism:[790,540,420], prismRot:0, beamDir:'right',
  cards:{x:1210,w:600,h:128,ys:[300,460,620,780]}, cardLab:24, cardVal:36,
  eq2:[960,540,1.0], bars:{x:600,w:880,h:120,ys:[380,600],lab:130}, note:[1040,820,52],
  newCard:[480,190,960,640], conf2:[960,920],
  end:{glyph:[600,440,200], word:[960,440,170], sub:[960,440,70], tag:[960,610,54], url:[960,735,40], cta:[960,860]}
};

// ------------------------------------------------------------- build UI
const ui=$('#ui');box(ui,0,0,W,H);
const hdr=box(el('div','hdr',null,ui),0,0,W,LY.hdrH);
box(el('div','title','PRISM <span>분수 진단</span>',hdr,{fontSize:LY.title[2]+'px'}),LY.title[0],LY.title[1]);
box(el('div','qcount','문항 3 / 3',hdr,{fontSize:LY.qc[2]+'px'}),LY.qc[0],LY.qc[1]);
box(el('div','prog',null,hdr),LY.prog[0],LY.prog[1],LY.prog[2]);
if(LY.showNav){
  box(el('div','dot',null,hdr),1300,52);
  box(el('div','navt','⛶ 전체화면',hdr,{fontSize:'32px'}),1345,38);
  box(el('div','navt','◀ 이전',hdr,{fontSize:'32px'}),1525,38);
}
const submit=box(el('div','submit','제출하기',V?ui:hdr,{fontSize:LY.submit[4]+'px'}),...LY.submit.slice(0,4));
const left=box(el('div','card',null,ui),...LY.left);
box(el('div','pill','문항 3 / 3',left,{fontSize:LY.pill[2]+'px'}),LY.pill[0],LY.pill[1]);
box(el('div','qtext',`주스가 ${frac(7,10)}<span class="L">L</span> 있었습니다. 그중에서 ${frac(1,4)}<span class="L">L</span>를 마셨다면 남은 주스는 몇 <span class="L">L</span>인지 기약분수로 나타내어 보세요.`,left,{fontSize:LY.qtext[3]+'px'}),LY.qtext[0],LY.qtext[1],LY.qtext[2]);
if(LY.ansbox){const a=box(el('div','ansbox','<i>정답</i>',left),...LY.ansbox)}
const confParent=V?ui:left;
box(el('div','confq','지금 답, 얼마나 확실한가요?',confParent,{fontSize:LY.confq[2]+'px'}),LY.confq[0],LY.confq[1]);
const [ox,oy,ow,oh,og,ofs]=LY.opts;const optEls=[];
OPTS.forEach((o,i)=>{const e=box(el('div','opt '+o[0],o[1]+`<div>${o[2]}</div>`,confParent,{fontSize:ofs+'px'}),ox+i*(ow+og),oy,ow,oh);optEls.push(e)});
if(LY.tools){
  const [tx,ty]=LY.tools;
  const pen='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1A2233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const era='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1A2233" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/></svg>';
  box(el('div','tool on',pen+'펜',ui,{fontSize:'34px'}),tx,ty,190,82);
  box(el('div','tool',era+'지우개',ui,{fontSize:'34px'}),tx+206,ty,190,82);
  box(el('div','tool off','🗑 모두 지우기',ui,{fontSize:'34px'}),tx+412,ty,240,82);
  box(el('div','tool','<span style="font-size:34px;color:#8A93A3">↶</span>',ui),tx+668,ty,86,82);
  box(el('div','tool','<span style="font-size:34px;color:#8A93A3">↷</span>',ui),tx+770,ty,86,82);
}
const canvas=box(el('div','canvas',null,ui),...LY.canvas);
// handwritten equation (the child's work)
const eq=el('div','hand',null,canvas,{fontSize:LY.eqFont+'px'});eq.id='eq';
eq.innerHTML=`<span class="tok" id="t1">${frac(7,10)}</span><span class="tok op" id="t2">−</span><span class="tok" id="t3">${frac(1,4)}</span><span class="tok op" id="t4">=</span><span class="tok" id="t5">${frac('<span id="n6">6</span>','<span id="d6">6</span>')}</span>`;
const t5bar=$('#t5 .bar');
// centre the equation in the canvas
const eqW=eq.offsetWidth, eqH=eq.offsetHeight;
box(eq,(LY.canvas[2]-eqW)/2,(LY.canvas[3]-eqH)/2);
// coral grading circle around 6/6
const t5=$('#t5');
const c6=off(t5,canvas);const cw=t5.offsetWidth, ch=t5.offsetHeight;
const CW2=Math.max(cw*2.7,ch*0.9), CH2=ch*1.22;
const circ=el('div',null,`<svg width="${CW2}" height="${CH2}" viewBox="0 0 220 155" preserveAspectRatio="none" style="overflow:visible"><path id="circP" d="M150 18 C 95 0, 22 18, 16 72 C 10 128, 92 152, 150 140 C 205 128, 215 70, 186 34 C 170 16, 130 6, 104 14" fill="none" stroke="#E0565B" stroke-width="7" stroke-linecap="round"/></svg>`,canvas);
box(circ,c6.x+cw/2-CW2/2,c6.y+ch/2-CH2/2);circ.style.position='absolute';
const circP=$('#circP');const circL=circP.getTotalLength();circP.style.strokeDasharray=circL;
// screen-space centre of the 6/6 when the camera is at rest (scale 1)
const sixUI=off(t5,ui);const SIX={x:sixUI.x+cw/2,y:sixUI.y+ch/2};
const eqUI=off(eq,ui);const EQC={x:eqUI.x+eqW/2,y:eqUI.y+eqH/2};

// floating confidence chip (S1) — a twin of option 1
const conf=$('#confFloat');conf.className='opt o1 abs';conf.innerHTML=OPTS[0][1]+`<div>${OPTS[0][2]}</div>`;
Object.assign(conf.style,{fontSize:ofs+'px',width:ow+'px',height:oh+'px',display:'flex'});
const opt1=off(optEls[0],ui);const SLOT={x:opt1.x+ow/2,y:opt1.y+oh/2};

// ------------------------------------------------------------- build DARK
const dark=$('#dark'), darkInner=$('#darkInner');
const ans=$('#ans66');ans.style.fontSize=LY.eqFont+'px';ans.innerHTML=frac('6','6');
const prismWrap=$('#prismWrap');const PS=LY.prism[2];
prismWrap.innerHTML=prismSVG(PS,'a')+`<div id="pglow" class="abs" style="left:${PS*0.18}px;top:${PS*0.22}px;width:${PS*0.64}px;height:${PS*0.58}px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(150,180,255,.35) 45%,rgba(150,180,255,0) 70%)"></div>`;
box(prismWrap,LY.prism[0]-PS/2,LY.prism[1]-PS/2,PS,PS);prismWrap.style.transform=`rotate(${LY.prismRot}deg)`;
// beam geometry
const P=LY.prism;
const beamFrom=V?{x:LY.ans66[0],y:LY.ans66[1]+40}:{x:LY.ans66[0]+40,y:LY.ans66[1]};

to(h.arrowBottom+0.55,'#p66',{color:'#E0565B',scale:1.12,duration:0.25,ease:'power2.out'});
to(h.arrowBottom+0.8,'#p66',{scale:1,duration:0.4,ease:'power2.inOut'});
// bars: the equation steps up and away, the pieces arrive
to(h.bars-0.2,eqG,{y:V?-220:-240,scale:0.62,opacity:0.0,duration:0.55,ease:'power3.in'});
const barParts=[barA.row,barB.row];gsap.set(barParts,{opacity:0,scaleX:0.6,transformOrigin:'0% 50%'});
gsap.set([labA,labB,labA2,labB2],{opacity:0,x:-20});
gsap.set([...barA.cells,...barB.cells],{opacity:0});
ft(h.bars,barParts,{opacity:0,scaleX:0.6},{opacity:1,scaleX:1,duration:0.6,stagger:0.12,ease:'expo.out'});
ft(h.bars+0.1,[...barA.cells],{opacity:0},{opacity:1,duration:0.2,stagger:0.04,ease:'none'});
ft(h.bars+0.22,[...barB.cells],{opacity:0},{opacity:1,duration:0.2,stagger:0.08,ease:'none'});
ft(h.bars+0.05,[labA,labB],{opacity:0,x:-20},{opacity:1,x:0,duration:0.5,stagger:0.12,ease:'power3.out'});
['#bA','#bB'].forEach((s,i)=>{const p=$(s);const L=p.getTotalLength();gsap.set(p,{strokeDasharray:L,strokeDashoffset:L,opacity:0});set(h.sizeNote-0.3+i*0.12,p,{opacity:1});to(h.sizeNote-0.3+i*0.12,p,{strokeDashoffset:0,duration:0.35,ease:'power2.out'})});
gsap.set(note,{opacity:0,y:24});ft(h.sizeNote,note,{opacity:0,y:24},{opacity:1,y:0,duration:0.5,ease:'back.out(1.6)'});
// --- S6: re-slice into twentieths (the explanation made for this child)
to(h.reslice-0.15,[note,'#bA','#bB'],{opacity:0,duration:0.25,ease:'power2.in'});
gsap.set([...barA.subs,...barB.subs],{scaleY:0});
ft(h.reslice,barA.subs,{scaleY:0},{scaleY:1,duration:0.3,stagger:0.025,ease:'power2.out'});
ft(h.reslice+0.1,barB.subs,{scaleY:0},{scaleY:1,duration:0.3,stagger:0.02,ease:'power2.out'});
to(h.reslice+0.25,[labA,labB],{opacity:0,y:-24,duration:0.25,ease:'power2.in'});
ft(h.reslice+0.35,[labA2,labB2],{opacity:0,x:0,y:24},{opacity:1,y:0,duration:0.45,stagger:0.08,ease:'power3.out'});
// new problem card
const ncx=LY.newCard[0];
to(h.newCard-0.1,BG,{x:-W*0.35,opacity:0,duration:0.45,ease:'power3.in'});
gsap.set(NC,{opacity:0,x:W*0.25,rotation:2});gsap.set('#spec',{width:0});
ft(h.newCard,NC,{opacity:0,x:W*0.25,rotation:2},{opacity:1,x:0,rotation:0,duration:0.75,ease:'expo.out'});
ft(h.newCard+0.25,'#spec',{width:0},{width:LY.newCard[2],duration:0.8,ease:'power3.inOut'});
gsap.set('#ans110 > .frac > span:first-child',{clipPath:'inset(0% 100% 0% 0%)'});
gsap.set('#ans110 .bar',{clipPath:'inset(0% 100% 0% 0%)'});
gsap.set('#ans110 > .frac > span:last-child',{clipPath:'inset(0% 100% 0% 0%)'});
to(h.writeAnswer,'#ans110 > .frac > span:first-child',{clipPath:'inset(0% 0% 0% 0%)',duration:0.12,ease:'none'});
to(h.writeAnswer+0.13,'#ans110 .bar',{clipPath:'inset(0% 0% 0% 0%)',duration:0.1,ease:'power1.inOut'});
to(h.writeAnswer+0.24,'#ans110 > .frac > span:last-child',{clipPath:'inset(0% 0% 0% 0%)',duration:0.22,ease:'none'});
gsap.set('#chk',{scale:0,rotation:-30});
ft(h.check,'#chk',{scale:0,rotation:-30},{scale:1,rotation:0,duration:0.5,ease:'back.out(2.4)'});
to(h.check,nbox,{borderColor:'#1D9A6C',duration:0.2});
gsap.set(conf2,{opacity:0,y:50,scale:0.7});
ft(h.confAgain,conf2,{opacity:0,y:50,scale:0.7},{opacity:1,y:0,scale:1,duration:0.6,ease:'back.out(1.8)'});
to(h.confAgain+0.6,conf2,{y:-6,duration:0.8,ease:'sine.inOut'});
to(h.newCard+0.8,NC,{y:-8,duration:2.6,ease:'sine.inOut'});

// --- S7: the card folds into the prism glyph
const ncc={x:LY.newCard[0]+LY.newCard[2]/2,y:LY.newCard[1]+LY.newCard[3]/2};
to(h.logo-0.05,[NC,conf2],{scale:0.05,opacity:0,x:`+=${GLY.x-ncc.x}`,y:`+=${GLY.y-ncc.y}`,duration:0.5,ease:'power3.in'});
gsap.set(END,{opacity:0});set(h.logo+0.3,END,{opacity:1});set(h.logo+0.3,P2,{opacity:0});
// END elements
gsap.set(glyph,{scale:0.25,rotation:-25,opacity:1});
ft(h.logo+0.3,glyph,{scale:0.25,rotation:-25},{scale:1,rotation:0,duration:0.8,ease:'back.out(1.6)'});
// glyph during the fold (on paper2 so the handoff happens on the same pixels)
const fold=el('div','abs',prismSVG(GS,'c'),P2);box(fold,GLY.x-GS/2,GLY.y-GS/2,GS,GS);
fold.querySelector('path').setAttribute('stroke','#3059D8');fold.querySelector('path').setAttribute('fill','#EAF0FF');
gsap.set(fold,{opacity:0,scale:0.25,rotation:-25});
ft(h.logo+0.15,fold,{opacity:0},{opacity:1,duration:0.15,ease:'none'});
const gRays=glyph.querySelectorAll('#gRays line');
gRays.forEach((l,i)=>{const L=Math.hypot(l.x2.baseVal.value-l.x1.baseVal.value,l.y2.baseVal.value-l.y1.baseVal.value);gsap.set(l,{strokeDasharray:L,strokeDashoffset:L,opacity:0});set(h.logo+0.75+i*0.07,l,{opacity:1});
  to(h.logo+0.75+i*0.07,l,{strokeDashoffset:0,duration:0.45,ease:'power3.out'})});
const gIn=glyph.querySelector('#gIn');gsap.set(gIn,{strokeDasharray:60,strokeDashoffset:60,opacity:0});set(h.logo+0.55,gIn,{opacity:.55});to(h.logo+0.55,gIn,{strokeDashoffset:0,duration:0.3,ease:'power2.in'});
// wordmark slides out from behind the glyph
[word,sub].forEach((w,i)=>{gsap.set(w,{clipPath:'inset(0% 100% 0% 0%)',x:-40});
  ft(h.logo+0.55+i*0.18,w,{clipPath:'inset(0% 100% 0% 0%)',x:-40},{clipPath:'inset(0% 0% 0% 0%)',x:0,duration:0.7,ease:'expo.out'})});
if(V){[word,sub].forEach(w=>{gsap.set(w,{clipPath:'inset(100% 0% 0% 0%)',x:0,y:40})});
  [word,sub].forEach((w,i)=>ft(h.logo+0.55+i*0.18,w,{clipPath:'inset(100% 0% 0% 0%)',y:40,x:0},{clipPath:'inset(0% 0% 0% 0%)',y:0,x:0,duration:0.7,ease:'expo.out'}));}
gsap.set(tag,{clipPath:'inset(0% 0% 100% 0%)',y:30});
ft(h.tagline,tag,{clipPath:'inset(0% 0% 100% 0%)',y:30},{clipPath:'inset(0% 0% 0% 0%)',y:0,duration:0.6,ease:'power3.out'});
gsap.set(url,{opacity:0,y:20});ft(h.url,url,{opacity:0,y:20},{opacity:1,y:0,duration:0.5,ease:'power3.out'});
gsap.set(cta,{opacity:0,scale:0.7});ft(h.cta,cta,{opacity:0,scale:0.7},{opacity:1,scale:1,duration:0.6,ease:'back.out(2)'});
// the end breathes: light keeps passing through the glyph, CTA pulses once
to(h.cta+0.9,cta,{scale:1.04,duration:0.35,ease:'sine.inOut',yoyo:true,repeat:1});
to(h.logo+1.3,glyph,{y:-8,duration:1.4,ease:'sine.inOut',yoyo:true,repeat:1});
to(h.logo+1.2,gRays,{attr:{x2:'+=6'},duration:1.2,ease:'sine.inOut',yoyo:true,repeat:1,stagger:0.1});
tl.set({}, {}, T.duration);

window.seek=f=>{tl.seek(f/FPS,false);applyCam()};
window.seek(0);window.READY=true;
})();
</script>
